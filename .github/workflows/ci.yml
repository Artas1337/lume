name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No Ubuntu, um dos testes abre o Lume de verdade com o Chrome do runner
      - run: npm test
      - name: Scripts de instalação do Linux
        if: runner.os == 'Linux'
        run: shellcheck instalador/linux/*.sh
