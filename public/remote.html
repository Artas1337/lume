<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Controle PC-TV</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f13;
    --btn: #1c1f27;
    --btn-on: #2b3040;
    --line: #2a2e3a;
    --text: #e9ecf5;
    --muted: #8a90a2;
    --accent: #4f7cff;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); user-select: none; -webkit-user-select: none; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  header b { font-size: 18px; letter-spacing: .04em; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #e5484d; }
  #status.on::before { background: #3dd68c; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--btn); border-radius: 12px; margin-bottom: 20px; }
  nav button { background: none; color: var(--muted); padding: 10px 0; border-radius: 9px; font-size: 13px; font-weight: 600; }
  nav button.on { background: var(--btn-on); color: var(--text); }
  button { border: 0; font: inherit; color: var(--text); background: var(--btn); touch-action: manipulation; }
  button:active { background: var(--btn-on); }
  .tab { display: none; flex: 1; flex-direction: column; gap: 14px; }
  .tab.on { display: flex; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .row.two { grid-template-columns: repeat(2, 1fr); }
  .row button { height: 58px; border-radius: 14px; font-size: 16px; font-weight: 600; }

  .dpad {
    position: relative;
    width: min(78vw, 300px);
    aspect-ratio: 1;
    margin: 6px auto 18px;
    border-radius: 50%;
    background: var(--btn);
    box-shadow: inset 0 0 0 1px var(--line);
    overflow: hidden;
  }
  .dpad button { position: absolute; background: none; color: var(--muted); font-size: 22px; }
  .dpad button:active { background: var(--btn-on); color: var(--text); }
  .dpad .up, .dpad .down { left: 30%; width: 40%; height: 30%; }
  .dpad .left, .dpad .right { top: 30%; width: 30%; height: 40%; }
  .dpad .up { top: 0; } .dpad .down { bottom: 0; }
  .dpad .left { left: 0; } .dpad .right { right: 0; }
  .dpad .ok {
    left: 30%; top: 30%; width: 40%; height: 40%;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 6px 20px rgba(79, 124, 255, .35);
  }
  .dpad .ok:active { background: #3c66e6; }

  #tp {
    flex: 1;
    min-height: 260px;
    border-radius: 18px;
    background: var(--btn);
    box-shadow: inset 0 0 0 1px var(--line);
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    touch-action: none;
  }
  form { display: flex; gap: 10px; }
  input {
    flex: 1;
    min-width: 0;
    height: 54px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--btn);
    color: var(--text);
    font: inherit;
    font-size: 16px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { padding: 0 20px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; }
  .titulo { font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .fundos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .fundos button { overflow: hidden; padding: 0 0 9px; border-radius: 14px; font-size: 13px; }
  .fundos button i { display: block; height: 58px; margin-bottom: 8px; background-size: cover; background-position: center; }
  .fundos button.ativo { box-shadow: 0 0 0 2px var(--accent); }
  .fundos [data-fundo="aurora"] i { background: radial-gradient(circle at 25% 20%, #4f7cff, transparent 60%), radial-gradient(circle at 80% 90%, #5a3cff, transparent 55%), #06070b; }
  .fundos [data-fundo="noite"] i { background: radial-gradient(120% 80% at 70% 0%, #1d2c66, #030409); }
  .fundos [data-fundo="por-do-sol"] i { background: linear-gradient(170deg, #1d0b25, #a8433a 70%, #e8924a); }
  .fundos [data-fundo="oceano"] i { background: linear-gradient(175deg, #01121d, #075a66 80%, #0c7f7a); }
  .fundos [data-fundo="grafite"] i { background: radial-gradient(110% 90% at 50% 0%, #2a2c34, #0a0b0e); }
  .foto {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 58px; border-radius: 14px;
    background: var(--btn); font-weight: 600;
  }
  .foto:active { background: var(--btn-on); }
  #cfgStatus { min-height: 1.4em; font-size: 13px; color: var(--muted); text-align: center; }
  footer {
    margin-top: auto;
    padding-top: 18px;
    padding-bottom: env(safe-area-inset-bottom);
    font-size: 11px;
    letter-spacing: .3em;
    text-align: center;
    text-transform: uppercase;
    color: var(--muted);
    opacity: .6;
  }
  footer b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <header><b>PC-TV</b><span id="status">desconectado</span></header>
  <nav>
    <button data-tab="pad" class="on">Controle</button>
    <button data-tab="touch">Touchpad</button>
    <button data-tab="kbd">Teclado</button>
    <button data-tab="cfg">Ajustes</button>
  </nav>

  <section id="pad" class="tab on">
    <div class="dpad">
      <button class="up" data-key="up" aria-label="Cima">▲</button>
      <button class="left" data-key="left" aria-label="Esquerda">◀</button>
      <button class="ok" data-key="ok">OK</button>
      <button class="right" data-key="right" aria-label="Direita">▶</button>
      <button class="down" data-key="down" aria-label="Baixo">▼</button>
    </div>
    <div class="row">
      <button data-key="back">↩ Voltar</button>
      <button data-cmd="home">⌂ Início</button>
      <button data-key="play">⏯</button>
    </div>
    <div class="row">
      <button data-vol="down" aria-label="Volume -">🔉</button>
      <button data-vol="mute" aria-label="Mudo">🔇</button>
      <button data-vol="up" aria-label="Volume +">🔊</button>
    </div>
  </section>

  <section id="touch" class="tab">
    <div id="tp">Arraste para mover<br>Toque para clicar<br>Dois dedos para rolar</div>
    <div class="row">
      <button data-cmd="click">Clique</button>
      <button data-key="back">↩ Voltar</button>
      <button data-cmd="home">⌂ Início</button>
    </div>
  </section>

  <section id="kbd" class="tab">
    <form id="form">
      <input id="txt" autocomplete="off" autocapitalize="off" placeholder="Digite (busca, e-mail…)">
      <button>Enviar</button>
    </form>
    <div class="row two">
      <button data-key="backspace">⌫ Apagar</button>
      <button data-key="ok">↵ Enter</button>
    </div>
  </section>

  <section id="cfg" class="tab">
    <label class="titulo" for="cfgNome">Seu nome na TV</label>
    <form id="formNome">
      <input id="cfgNome" maxlength="30" autocomplete="off" placeholder="Ex.: Arthur">
      <button>Salvar</button>
    </form>
    <span class="titulo">Papel de parede</span>
    <div class="fundos" id="cfgFundos"></div>
    <label class="foto"><input type="file" id="cfgFoto" accept="image/*" hidden>📷 Usar foto do celular</label>
    <p id="cfgStatus" role="status"></p>
  </section>

  <footer>PC-TV by <b>Art Code</b></footer>

<script>
  let ws;
  const status = document.getElementById('status');

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { status.textContent = 'conectado'; status.classList.add('on'); };
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.t === 'config') mostrarCfg(m.config);
      } catch {}
    };
    ws.onclose = () => {
      status.textContent = 'desconectado';
      status.classList.remove('on');
      setTimeout(connect, 1000);
    };
  }
  connect();

  function send(msg) {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  // Abas
  document.querySelectorAll('nav button').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('nav button, .tab').forEach((el) => el.classList.remove('on'));
      b.classList.add('on');
      document.getElementById(b.dataset.tab).classList.add('on');
    });
  });

  // Botões, com repetição ao segurar (setas e volume)
  const REPEAT = new Set(['up', 'down', 'left', 'right']);
  document.querySelectorAll('[data-key], [data-vol], [data-cmd]').forEach((el) => {
    const d = el.dataset;
    const msg = d.key ? { t: 'key', k: d.key } : d.vol ? { t: 'vol', v: d.vol } : { t: d.cmd };
    const repeats = REPEAT.has(d.key) || d.vol === 'up' || d.vol === 'down';
    let delay, interval;
    const stop = () => { clearTimeout(delay); clearInterval(interval); };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      send(msg);
      navigator.vibrate?.(8);
      if (repeats) delay = setTimeout(() => { interval = setInterval(() => send(msg), 110); }, 400);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, stop));
  });

  // Touchpad
  const tp = document.getElementById('tp');
  const SPEED = 2.2;
  let last, startAt, moved, maxFingers, frame = 0;
  const acc = { dx: 0, dy: 0, scroll: 0 };

  const center = (touches) => {
    let x = 0, y = 0;
    for (const t of touches) { x += t.clientX; y += t.clientY; }
    return { x: x / touches.length, y: y / touches.length };
  };

  function flush() {
    frame = 0;
    const dx = Math.round(acc.dx), dy = Math.round(acc.dy), s = Math.round(acc.scroll);
    acc.dx -= dx; acc.dy -= dy; acc.scroll -= s;
    if (dx || dy) send({ t: 'move', dx, dy });
    if (s) send({ t: 'scroll', dy: s });
  }

  tp.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 1) { startAt = Date.now(); moved = 0; maxFingers = 1; }
    maxFingers = Math.max(maxFingers, e.touches.length);
    last = center(e.touches);
  }, { passive: false });

  tp.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const p = center(e.touches);
    const dx = p.x - last.x, dy = p.y - last.y;
    last = p;
    moved += Math.abs(dx) + Math.abs(dy);
    if (e.touches.length >= 2) acc.scroll -= dy * 3;
    else { acc.dx += dx * SPEED; acc.dy += dy * SPEED; }
    frame ||= requestAnimationFrame(flush);
  }, { passive: false });

  tp.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (e.touches.length) { last = center(e.touches); return; }
    if (maxFingers === 1 && moved < 10 && Date.now() - startAt < 250) {
      send({ t: 'click' });
      navigator.vibrate?.(8);
    }
  }, { passive: false });

  // Ajustes: nome na saudação da TV e papel de parede
  const FUNDOS = [['aurora', 'Aurora'], ['noite', 'Noite'], ['por-do-sol', 'Pôr do sol'], ['oceano', 'Oceano'], ['grafite', 'Grafite']];
  const cfgNome = document.getElementById('cfgNome');
  const cfgStatus = document.getElementById('cfgStatus');

  function mostrarCfg(c) {
    if (document.activeElement !== cfgNome) cfgNome.value = c.nome || '';
    const opcoes = c.temImagem ? [...FUNDOS, ['imagem', 'Minha foto']] : FUNDOS;
    const caixa = document.getElementById('cfgFundos');
    caixa.replaceChildren(...opcoes.map(([id, nome]) => {
      const b = document.createElement('button');
      b.dataset.fundo = id;
      b.classList.toggle('ativo', c.fundo === id);
      const amostra = document.createElement('i');
      if (id === 'imagem') amostra.style.backgroundImage = `url(/papel?v=${c.versao})`;
      b.append(amostra, nome);
      b.addEventListener('click', () => enviarCfg({ fundo: id }));
      return b;
    }));
  }

  async function enviarCfg(mudancas) {
    try {
      const r = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(mudancas),
      });
      if (!r.ok) throw new Error();
      mostrarCfg(await r.json());
      cfgStatus.textContent = 'Pronto, já está na TV.';
    } catch {
      cfgStatus.textContent = 'Não deu certo. Confira se o PC-TV está aberto e tente de novo.';
    }
  }

  // Foto do celular vira um JPEG de no máximo 2560 px antes de enviar
  async function reduzir(arquivo) {
    const bmp = await createImageBitmap(arquivo);
    const escala = Math.min(1, 2560 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * escala);
    c.height = Math.round(bmp.height * escala);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.88));
  }

  document.getElementById('formNome').addEventListener('submit', (e) => {
    e.preventDefault();
    cfgNome.blur();
    enviarCfg({ nome: cfgNome.value });
  });

  document.getElementById('cfgFoto').addEventListener('change', async (e) => {
    const arquivo = e.target.files[0];
    e.target.value = '';
    if (!arquivo) return;
    cfgStatus.textContent = 'Enviando a foto…';
    try {
      const r = await fetch('/api/papel-de-parede', {
        method: 'POST',
        headers: { 'Content-Type': 'image/jpeg' },
        body: await reduzir(arquivo),
      });
      if (!r.ok) throw new Error();
      mostrarCfg(await r.json());
      cfgStatus.textContent = 'Foto aplicada na TV.';
    } catch {
      cfgStatus.textContent = 'Não consegui enviar a foto. Tente outra imagem.';
    }
  });

  fetch('/api/config').then((r) => r.json()).then(mostrarCfg).catch(() => {});

  // Teclado
  const txt = document.getElementById('txt');
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (txt.value) send({ t: 'text', s: txt.value });
    txt.value = '';
    txt.focus();
  });
</script>
</body>
</html>
